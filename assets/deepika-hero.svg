<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Deepika T — Developer Profile</title><desc id="desc">Burgundy animated hero banner for Deepika T.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".55" stop-color="#30101F"/><stop offset="1" stop-color="#701A3D"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C77B9B" stop-opacity="0"/><stop offset=".5" stop-color="#E5B5C7" stop-opacity=".7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#E5B5C7" stroke-opacity=".10" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="1010" cy="92" r="120" fill="none" stroke="#C77B9B" stroke-opacity=".22"/><circle cx="1010" cy="92" r="84" fill="none" stroke="#E5B5C7" stroke-opacity=".18"/>
<path d="M0 290 C220 220 320 340 540 250 S900 170 1200 240" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-width="2"/>
<path d="M0 290 C220 220 320 340 540 250 S900 170 1200 240" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="18 260" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-556" dur="8s" repeatCount="indefinite"/></path>
<rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#shine)" opacity=".18"><animate attributeName="x" values="-1200;1200" dur="9s" repeatCount="indefinite"/></rect>
<text x="82" y="145" fill="#F8F0F3" font-family="Georgia,serif" font-size="62" letter-spacing="1">Deepika T</text>
<text x="86" y="193" fill="#E5B5C7" font-family="Arial,sans-serif" font-size="22" letter-spacing="3">COMPUTER SCIENCE STUDENT</text>
<text x="86" y="245" fill="#F8F0F3" fill-opacity=".82" font-family="Arial,sans-serif" font-size="18">Full-Stack Development  |  Problem Solving  |  Learning by Building</text>
<path d="M86 270H420" stroke="#C77B9B" stroke-width="3" stroke-linecap="round"/>
<circle cx="1090" cy="250" r="5" fill="#E5B5C7"/><circle cx="1120" cy="220" r="3" fill="#C77B9B"/><circle cx="1060" cy="195" r="4" fill="#E5B5C7"/>
</svg>